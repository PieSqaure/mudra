org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Lets `./gradlew :core:test` build/test the pure-Kotlin :core module without ever configuring
# :app (and therefore without needing the Android Gradle Plugin/SDK at all). Bare, unscoped
# tasks like `clean` still touch every module - prefer `:core:clean` when you want to stay
# Android-SDK-free.
org.gradle.configureondemand=true
